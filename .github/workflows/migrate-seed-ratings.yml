name: Migrate Seed Ratings to KV

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore ratings-seed.json from git history
        run: git show HEAD~1:data/ratings-seed.json > data/ratings-seed.json

      - name: Migrate seed ratings to Cloudflare KV
        run: node scripts/migrate-seed-ratings-to-kv.mjs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}

name: Fetch Pending Recipe from Notion
on:
  schedule:
    - cron: '0 1 * * 4'  # Thursday 1AM UTC (2h before scheduled task)
  workflow_dispatch:

concurrency:
  group: fetch-recipe
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch from Notion
        run: node scripts/fetch-notion-recipe.mjs
        env:
          NOTION_TOKEN_V2: ${{ secrets.NOTION_TOKEN_V2 }}
          NOTION_ACTIVE_USER: ${{ secrets.NOTION_ACTIVE_USER }}

      - name: Create PR with pending file
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -f notion/pending-recipe.json ]; then
            BRANCH="notion/pending-recipe-$(date +%Y%m%d)"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add notion/pending-recipe.json notion/published.json "src/assets/images/recipes/**"
            git commit -m "chore: fetch pending recipe from Notion" || echo "No changes to commit"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "chore: fetch pending recipe from Notion" \
              --body "Automated: fetched pending recipe data and images from Notion." \
              --base main \
              --head "$BRANCH"
          else
            echo "No recipe ready to publish"
          fi

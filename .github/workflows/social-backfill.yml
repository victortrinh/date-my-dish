name: Backfill Social Media Posts

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to backfill"
        type: choice
        options:
          - both
          - instagram
          - pinterest
        default: both
      recipes_per_run:
        description: "Number of recipes to post in this run"
        type: number
        default: 2

concurrency:
  group: social-backfill
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build site for local image resolution
        run: npm run build

      - name: Run backfill
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PLATFORM: ${{ inputs.platform }}
          RECIPES_PER_RUN: ${{ inputs.recipes_per_run }}
        run: node scripts/social-post.mjs --backfill

      - name: Create PR with post log
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/social-log-backfill-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add data/social-posts-log.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update social posts log (backfill)"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: update social posts log (backfill)" \
            --body "Automated: social media backfill log update." \
            --base main \
            --head "$BRANCH"

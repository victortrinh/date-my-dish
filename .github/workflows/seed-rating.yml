name: Seed Rating to KV

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Recipe slug (e.g., cacio-e-pepe)"
        required: true
        type: string
      averageRating:
        description: "Average rating (e.g., 4.8)"
        required: true
        type: string
      ratingCount:
        description: "Number of ratings (e.g., 42)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Seed rating to Cloudflare KV
        run: node scripts/seed-rating-to-kv.mjs "${{ inputs.slug }}" "${{ inputs.averageRating }}" "${{ inputs.ratingCount }}"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}

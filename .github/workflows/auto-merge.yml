name: Auto-merge PRs

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only Renovate's own dependency-update PRs, and only once they're no
    # longer a draft: enabling auto-merge on a draft PR fails outright
    # ("Pull request is a draft"), and this workflow has no business
    # touching a human-authored PR at all.
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        run: gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

name: Auto-merge PRs

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Two kinds of PR merge themselves once the required checks pass:
    #   - Renovate's dependency updates (renovate.json decides which ones
    #     ask for auto-merge; this only turns it on).
    #   - The automation-state PRs the scheduled workflows open with
    #     PAT_TOKEN (so they show up as the repo owner), matched by branch
    #     prefix and then by the files they touch, below.
    # Never a draft (enabling auto-merge on one fails outright), and never
    # a human-authored, Importer or Pinterest queue PR: those merges publish
    # or approve something and stay a person's call.
    if: >-
      github.event.pull_request.draft == false && (
        github.event.pull_request.user.login == 'renovate[bot]' || (
          github.event.pull_request.user.login == github.repository_owner &&
          github.event.pull_request.head.repo.full_name == github.repository && (
            startsWith(github.event.pull_request.head.ref, 'chore/social-log-pin-rotation-') ||
            startsWith(github.event.pull_request.head.ref, 'chore/lighthouse-results-') ||
            startsWith(github.event.pull_request.head.ref, 'chore/seo-ranking-')
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR only touches automation state
        if: github.event.pull_request.user.login != 'renovate[bot]'
        run: |
          case "$HEAD_REF" in
            chore/social-log-pin-rotation-*) ALLOWED='^data/social-posts-log\.json$' ;;
            chore/lighthouse-results-*)      ALLOWED='^data/lighthouse/' ;;
            chore/seo-ranking-*)             ALLOWED='^data/seo/' ;;
          esac
          FILES=$(gh pr diff "$PR_NUMBER" --name-only --repo "$GITHUB_REPOSITORY")
          OUTSIDE=$(printf '%s\n' "$FILES" | grep -Ev "$ALLOWED" || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::Not auto-merging: files outside $ALLOWED"
            printf '%s\n' "$OUTSIDE"
            exit 1
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}

      - name: Enable auto-merge (squash)
        run: gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

name: Pinterest Pin Rotation

on:
  schedule:
    # Runs daily at 10 AM UTC (good Pinterest posting time)
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: pinterest-rotation
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Post scheduled pin variants
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_BOARD_ID_ARTICLES: ${{ secrets.PINTEREST_BOARD_ID_ARTICLES }}
          PINTEREST_BOARD_ID_REVIEWS: ${{ secrets.PINTEREST_BOARD_ID_REVIEWS }}
        run: node scripts/pinterest-rotate.mjs

      - name: Create PR with updated log
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/social-log-pin-rotation-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add data/social-posts-log.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update social posts log (pin rotation)"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: update social posts log (pin rotation)" \
            --body "Automated: Pinterest pin rotation log update." \
            --base main \
            --head "$BRANCH"

name: Social Media Post on Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/content/recipes/en/**/*.mdx"
      - "src/content/articles/en/**/*.mdx"
      - "src/content/reviews/en/**/*.mdx"

concurrency:
  group: social-post-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Detect new content
        id: detect
        run: |
          NEW_FILES=$(git diff --name-only --diff-filter=A HEAD~1 -- 'src/content/recipes/en/*.mdx' 'src/content/articles/en/*.mdx' 'src/content/reviews/en/*.mdx' || true)

          UNPOSTED=$(node -e "
            const fs = require('fs');
            const log = JSON.parse(fs.readFileSync('data/social-posts-log.json'));
            const dirs = [
              'src/content/recipes/en',
              'src/content/articles/en',
              'src/content/reviews/en',
            ];
            const missing = [];
            for (const dir of dirs) {
              if (!fs.existsSync(dir)) continue;
              const slugs = fs.readdirSync(dir).filter(f => f.endsWith('.mdx')).map(f => f.replace('.mdx',''));
              for (const slug of slugs) {
                if (!log[slug]) missing.push(dir + '/' + slug + '.mdx');
              }
            }
            if (missing.length) console.log(missing.join('\n'));
          ")

          ALL_NEW=$(printf '%s\n%s' "${NEW_FILES}" "${UNPOSTED}" | sort -u | grep -v '^$' || true)

          if [ -z "$ALL_NEW" ]; then
            echo "count=0" >> $GITHUB_OUTPUT
            echo "recipes=" >> $GITHUB_OUTPUT
          else
            echo "recipes<<EOF" >> $GITHUB_OUTPUT
            echo "$ALL_NEW" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "count=$(echo "$ALL_NEW" | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT
          fi
          echo "Detected content to post: $ALL_NEW"

      - name: Post to social media
        if: steps.detect.outputs.count != '0'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_BOARD_ID_ARTICLES: ${{ secrets.PINTEREST_BOARD_ID_ARTICLES }}
          PINTEREST_BOARD_ID_REVIEWS: ${{ secrets.PINTEREST_BOARD_ID_REVIEWS }}
        run: node scripts/social-post.mjs ${{ steps.detect.outputs.recipes }}

      - name: Create PR with post log
        if: steps.detect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/social-log-deploy-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add data/social-posts-log.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update social posts log"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: update social posts log" \
            --body "Automated: social media post log update after deploy." \
            --base main \
            --head "$BRANCH"

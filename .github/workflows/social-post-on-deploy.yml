name: Queue Pinterest Pins on Publish

# Merging a publish PR (src/content/date-spots.json or a Companion File in
# src/content/editorial/) queues pins for every newly published Review or
# Date Spot: scripts/social-post.mjs renders each pin's image from the post's
# own photos into data/pinterest/ and appends "pending" pins with nested
# English URLs to data/social-posts-log.json. Nothing is posted here;
# pinterest-pin-rotation.yml posts the queue daily. Instagram is not wired
# to Date Spots (revisited in #505).

on:
  push:
    branches: [main]
    paths:
      - "src/content/date-spots.json"
      - "src/content/editorial/*.json"
  workflow_dispatch:

concurrency:
  group: social-post-queue
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Queue pins for newly published Date Spots
        run: node scripts/social-post.mjs

      - name: Create PR with queued pins
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git add data/social-posts-log.json data/pinterest
          if git diff --cached --quiet; then
            echo "Nothing new to queue."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/pinterest-queue-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git commit -m "chore: queue Pinterest pins for new Date Spots"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: queue Pinterest pins for new Date Spots" \
            --body "Automated: pins queued in data/social-posts-log.json for newly published Date Spots, with images in data/pinterest/. Merging approves posting; pinterest-pin-rotation.yml posts them on their scheduled days." \
            --base main \
            --head "$BRANCH"

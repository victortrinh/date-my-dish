name: SEO Auto-Optimize

on:
  push:
    branches: [main]
    paths: ['data/seo/rankings-*.json']
  workflow_dispatch:

concurrency:
  group: seo-auto-optimize
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Close stale optimize PR
        run: |
          OPEN_PRS=$(gh pr list --label "seo-auto-optimize" --state open --json number --jq '.[].number')
          for PR in $OPEN_PRS; do
            gh pr close "$PR" --comment "Superseded by new ranking data."
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Claude Code SEO Optimization
        run: |
          cat <<'PROMPT' | npx @anthropic-ai/claude-code@latest --print \
            --model claude-sonnet-4-6 \
            --max-turns 20 \
            --allowedTools "Edit,Read,Write,Glob,Grep,Bash(npm run check:*),Bash(node:*)"
          You are running the weekly SEO auto-optimization for Date My Dish based on fresh ranking data.

          ## Input Data

          1. Read the MOST RECENT `data/seo/rankings-*.json` file (highest date in filename).
          2. If a previous week's snapshot exists, read that too for delta comparison.

          ## Optimization Targets

          Analyze the ranking data and prioritize fixes in this order:

          ### 1. Striking Distance Keywords (HIGH PRIORITY)
          Pages with GSC avgPosition 4-20 AND ≥10 impressions.
          These are close to page 1 — small improvements can yield big traffic gains.
          - Ensure the target keyword appears in an H2 heading in the MDX prose
          - Ensure the keyword is in the frontmatter `keywords[]` array
          - Check that the meta `description` includes the keyword naturally
          - Add 1-2 sentences in the prose strengthening relevance for that keyword

          ### 2. Low CTR Pages (MEDIUM PRIORITY)
          Pages with ≥50 impressions but CTR <2%.
          The page ranks but nobody clicks — the meta description needs work.
          - Rewrite the frontmatter `description` (max 160 chars) to be more compelling
          - Include the primary keyword, a benefit, and a call to action
          - Make it specific and enticing (not generic)

          ### 3. Declining Pages (MEDIUM PRIORITY)
          Pages where avgPosition dropped ≥3 positions vs. the previous week.
          - Add 1-2 internal cross-links FROM other relevant recipe pages TO this page
          - Cross-links use format: `/en/recipes/{slug}/` (with trailing slash)
          - Ensure the declining keyword still appears in H2s and prose

          ### 4. Missing Keywords (LOW PRIORITY)
          Keywords GSC shows we rank for but are NOT in the recipe's frontmatter `keywords[]`.
          - Add them to the `keywords[]` array (max 10 keywords per recipe)

          ## Restrictions
          - ONLY modify files in `src/content/recipes/` and `src/content/articles/` (MDX frontmatter and prose)
          - Do NOT modify components, layouts, pages, i18n files, or config files
          - Do NOT rewrite prose wholesale — make targeted, surgical additions
          - Do NOT add more than 3 internal links per page per run
          - Do NOT modify a recipe if it already ranks position 1-3 (don't fix what isn't broken)
          - Keep all changes bilingual — if you modify an EN recipe, make the equivalent FR change
          - Preserve all existing frontmatter fields exactly as-is (only add/modify specific fields)

          ## After Changes
          First run `node scripts/fetch-ratings.mjs` to generate `data/ratings.json` (required by recipe pages).
          Then run `npm run check` to verify no TypeScript/schema errors.

          ## Output
          Provide a summary:
          - Pages optimized and what was changed
          - Keywords targeted and current positions
          - Expected impact (which keywords should improve)
          - Any issues requiring manual attention
          PROMPT
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Write optimization log entry
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          // Find modified content files
          const { execSync } = require('child_process');
          const modified = execSync('git diff --name-only', { encoding: 'utf-8' })
            .trim().split('\n')
            .filter(f => f.startsWith('src/content/') && f.endsWith('.mdx'))
            .filter(f => f.includes('/en/')); // Track EN pages only (FR follows EN)

          if (modified.length === 0) process.exit(0);

          // Load latest rankings snapshot for positions
          const dataDir = 'data/seo';
          const snapshots = fs.readdirSync(dataDir)
            .filter(f => f.match(/^rankings-.*\.json$/))
            .sort().reverse();
          const latestSnap = snapshots.length > 0
            ? JSON.parse(fs.readFileSync(path.join(dataDir, snapshots[0]), 'utf-8'))
            : null;

          // Build log entry
          const pages = modified.map(file => {
            // Convert file path to URL path: src/content/recipes/en/slug.mdx -> /en/recipes/slug/
            const match = file.match(/src\/content\/(recipes|articles)\/en\/(.+)\.mdx$/);
            if (!match) return null;
            const urlPath = '/en/' + match[1] + '/' + match[2] + '/';
            const pageData = latestSnap?.pages?.[urlPath];
            const gscBest = pageData?.gsc?.queries?.reduce((best, q) =>
              !best || q.avgPosition < best.avgPosition ? q : best, null);
            return {
              path: urlPath,
              actions: ['auto-optimized'],
              keywords: pageData?.gsc?.queries?.map(q => q.keyword) || [],
              positionAtTime: {
                serp: pageData?.serp?.position || null,
                gsc: gscBest?.avgPosition || null
              }
            };
          }).filter(Boolean);

          if (pages.length === 0) process.exit(0);

          const logFile = path.join(dataDir, 'optimization-log.json');
          const log = fs.existsSync(logFile)
            ? JSON.parse(fs.readFileSync(logFile, 'utf-8'))
            : [];

          log.push({
            date: new Date().toISOString().split('T')[0],
            runId: '${{ github.run_id }}',
            prNumber: null,
            mergedAt: null,
            pages
          });

          fs.writeFileSync(logFile, JSON.stringify(log, null, 2) + '\n');
          console.log('Optimization log updated:', pages.length, 'pages tracked');
          "

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b seo-optimize/${{ github.run_id }}
          git add src/content/ data/seo/optimization-log.json
          git commit -m "fix(seo): auto-optimize from ranking data

          Generated by SEO Auto-Optimize workflow.

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push origin seo-optimize/${{ github.run_id }}
        env:
          GH_TOKEN: ${{ secrets.CREATE_PR_TOKEN }}

      - name: Create Pull Request
        id: create_pr
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          PR_URL=$(gh pr create \
            --title "SEO Optimize: ranking-based fixes" \
            --body "## Summary
          - Automated SEO optimization based on fresh ranking data
          - Striking distance keywords, low CTR pages, and declining pages addressed

          ## Verify
          - [ ] All modified recipes still render correctly
          - [ ] No schema validation errors
          - [ ] Keyword additions are natural and relevant

          🤖 Generated with [Claude Code](https://claude.com/claude-code)" \
            --label "seo-auto-optimize")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.CREATE_PR_TOKEN }}

      - name: Update optimization log with PR number
        if: steps.create_pr.outputs.pr_number
        run: |
          node -e "
          const fs = require('fs');
          const log = JSON.parse(fs.readFileSync('data/seo/optimization-log.json', 'utf-8'));
          const entry = log.find(e => e.runId === '${{ github.run_id }}');
          if (entry) {
            entry.prNumber = ${{ steps.create_pr.outputs.pr_number }};
            fs.writeFileSync('data/seo/optimization-log.json', JSON.stringify(log, null, 2) + '\n');
            // Amend the commit to include the PR number
            require('child_process').execSync('git add data/seo/optimization-log.json && git commit --amend --no-edit', { stdio: 'inherit' });
            require('child_process').execSync('git push origin seo-optimize/${{ github.run_id }} --force-with-lease', { stdio: 'inherit' });
            console.log('Updated optimization log with PR #${{ steps.create_pr.outputs.pr_number }}');
          }
          "
        env:
          GH_TOKEN: ${{ secrets.CREATE_PR_TOKEN }}

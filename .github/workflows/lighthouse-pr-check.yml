name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for content changes
        id: content
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD -- src/content/recipes/ src/content/articles/ src/pages/)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No content pages changed — skipping Lighthouse"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Content changes detected:"
            echo "$CHANGED"
          fi

      - uses: actions/setup-node@v4
        if: steps.content.outputs.skip == 'false'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.content.outputs.skip == 'false'

      - run: npm run build
        if: steps.content.outputs.skip == 'false'

      - name: Generate changed page URLs
        if: steps.content.outputs.skip == 'false'
        id: urls
        run: node scripts/generate-lighthouse-urls.cjs --mode=changed --base=origin/${{ github.event.pull_request.base.ref }}

      - name: Run Lighthouse CI (Desktop)
        if: steps.content.outputs.skip == 'false' && steps.urls.outputs.url_count > 0
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true
          artifactName: lighthouse-results-desktop

      - name: Run Lighthouse CI (Mobile)
        if: steps.content.outputs.skip == 'false' && steps.urls.outputs.url_count > 0
        id: lhci-mobile
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc-mobile.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true
          artifactName: lighthouse-results-mobile

      - name: Post PR comment with scores
        if: always() && steps.content.outputs.skip == 'false' && (steps.lhci.outcome == 'success' || steps.lhci-mobile.outcome == 'success')
        uses: actions/github-script@v7
        with:
          script: |
            const icon = (v) => v >= 90 ? '🟢' : v >= 50 ? '🟠' : '🔴';

            function buildTable(manifest, links) {
              let table = '| URL | Perf | A11y | Best Practices | SEO | Report |\n';
              table += '|-----|------|------|----------------|-----|--------|\n';
              for (const entry of manifest) {
                const path = new URL(entry.url).pathname;
                const s = {
                  perf: Math.round(entry.summary.performance * 100),
                  a11y: Math.round(entry.summary.accessibility * 100),
                  bp: Math.round(entry.summary['best-practices'] * 100),
                  seo: Math.round(entry.summary.seo * 100),
                };
                const link = links[entry.url] ? `[View](${links[entry.url]})` : '--';
                table += `| \`${path}\` | ${icon(s.perf)} ${s.perf} | ${icon(s.a11y)} ${s.a11y} | ${icon(s.bp)} ${s.bp} | ${icon(s.seo)} ${s.seo} | ${link} |\n`;
              }
              return table;
            }

            let body = '<!-- lighthouse-ci-results -->\n';
            body += '## Lighthouse CI Results\n\n';

            // Desktop results
            const desktopManifestRaw = `${{ steps.lhci.outputs.manifest }}`;
            if (desktopManifestRaw) {
              const desktopManifest = JSON.parse(desktopManifestRaw);
              const desktopLinks = JSON.parse(`${{ steps.lhci.outputs.links }}`);
              body += '### Desktop\n\n';
              body += buildTable(desktopManifest, desktopLinks);
              body += '\n';
            }

            // Mobile results
            const mobileManifestRaw = `${{ steps.lhci-mobile.outputs.manifest }}`;
            if (mobileManifestRaw) {
              const mobileManifest = JSON.parse(mobileManifestRaw);
              const mobileLinks = JSON.parse(`${{ steps.lhci-mobile.outputs.links }}`);
              body += '### Mobile\n\n';
              body += buildTable(mobileManifest, mobileLinks);
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body.includes('<!-- lighthouse-ci-results -->')
            );

            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            };

            if (existing) {
              await github.rest.issues.updateComment({
                ...params,
                comment_id: existing.id,
              });
            } else {
              await github.rest.issues.createComment({
                ...params,
                issue_number: context.issue.number,
              });
            }

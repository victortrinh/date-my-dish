name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Performance budgets (docs/editorial-publishing-system.md): the site is
    # built from the mechanical acceptance fixtures so every post type has a
    # page to audit, and one URL per post type is checked on mobile and desktop.
    env:
      DATE_SPOT_SOURCE: tests/fixtures/date-spots.json
      CONTRIBUTOR_RECIPE_SOURCE: tests/fixtures/contributor-recipes.json
      EXTENDED_PROFILE_SOURCE: tests/fixtures/extended-profiles.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for rendering or content changes
        id: content
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD -- \
            src/content/date-spots.json \
            src/content/editorial/ \
            src/content/extended-profiles.json \
            src/content/contributor-recipes.json \
            src/components/ \
            src/layouts/ \
            src/pages/ \
            src/styles/ \
            tests/fixtures/ \
            .lighthouserc.cjs \
            .lighthouserc-mobile.cjs \
            scripts/generate-lighthouse-urls.cjs \
            .github/workflows/lighthouse-pr-check.yml)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No rendering or content changes, skipping Lighthouse"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            echo "$CHANGED"
          fi

      - uses: actions/setup-node@v7
        if: steps.content.outputs.skip == 'false'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.content.outputs.skip == 'false'

      - name: Restore Astro image cache
        if: steps.content.outputs.skip == 'false'
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-image-cache-${{ runner.os }}-${{ hashFiles('src/assets/images/**') }}
          restore-keys: |
            astro-image-cache-${{ runner.os }}-

      - name: Validate content frontmatter
        if: steps.content.outputs.skip == 'false'
        run: node scripts/validate-descriptions.mjs

      - run: npm run build
        if: steps.content.outputs.skip == 'false'

      - name: Generate one URL per post type
        if: steps.content.outputs.skip == 'false'
        id: urls
        run: node scripts/generate-lighthouse-urls.cjs --mode=post-types

      - name: Run Lighthouse CI (Desktop)
        if: steps.content.outputs.skip == 'false' && steps.urls.outputs.url_count > 0
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true
          artifactName: lighthouse-results-desktop

      - name: Run Lighthouse CI (Mobile)
        if: steps.content.outputs.skip == 'false' && steps.urls.outputs.url_count > 0
        id: lhci-mobile
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc-mobile.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true
          artifactName: lighthouse-results-mobile

      - name: Post PR comment with scores
        if: always() && steps.content.outputs.skip == 'false' && (steps.lhci.outcome == 'success' || steps.lhci-mobile.outcome == 'success')
        uses: actions/github-script@v9
        with:
          script: |
            const icon = (v) => v >= 90 ? '🟢' : v >= 50 ? '🟠' : '🔴';

            function buildTable(manifest, links) {
              let table = '| URL | Perf | A11y | Best Practices | SEO | Report |\n';
              table += '|-----|------|------|----------------|-----|--------|\n';
              for (const entry of manifest) {
                const path = new URL(entry.url).pathname;
                const s = {
                  perf: Math.round(entry.summary.performance * 100),
                  a11y: Math.round(entry.summary.accessibility * 100),
                  bp: Math.round(entry.summary['best-practices'] * 100),
                  seo: Math.round(entry.summary.seo * 100),
                };
                const link = links[entry.url] ? `[View](${links[entry.url]})` : '--';
                table += `| \`${path}\` | ${icon(s.perf)} ${s.perf} | ${icon(s.a11y)} ${s.a11y} | ${icon(s.bp)} ${s.bp} | ${icon(s.seo)} ${s.seo} | ${link} |\n`;
              }
              return table;
            }

            let body = '<!-- lighthouse-ci-results -->\n';
            body += '## Lighthouse CI Results\n\n';

            // Desktop results
            const desktopManifestRaw = `${{ steps.lhci.outputs.manifest }}`;
            if (desktopManifestRaw) {
              const desktopManifest = JSON.parse(desktopManifestRaw);
              const desktopLinks = JSON.parse(`${{ steps.lhci.outputs.links }}`);
              body += '### Desktop\n\n';
              body += buildTable(desktopManifest, desktopLinks);
              body += '\n';
            }

            // Mobile results
            const mobileManifestRaw = `${{ steps.lhci-mobile.outputs.manifest }}`;
            if (mobileManifestRaw) {
              const mobileManifest = JSON.parse(mobileManifestRaw);
              const mobileLinks = JSON.parse(`${{ steps.lhci-mobile.outputs.links }}`);
              body += '### Mobile\n\n';
              body += buildTable(mobileManifest, mobileLinks);
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body.includes('<!-- lighthouse-ci-results -->')
            );

            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            };

            if (existing) {
              await github.rest.issues.updateComment({
                ...params,
                comment_id: existing.id,
              });
            } else {
              await github.rest.issues.createComment({
                ...params,
                issue_number: context.issue.number,
              });
            }

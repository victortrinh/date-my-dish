name: Publish Notion Story

on:
  schedule:
    - cron: '0 1 * * 3'  # Wednesday 1AM UTC
  workflow_dispatch:

concurrency:
  group: publish-notion-story
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch and gate the next ready Story
        id: fetch
        run: node scripts/fetch-notion-story.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Open PR with the published Story
        if: success() && steps.fetch.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          POST_TYPE="${{ steps.fetch.outputs.post_type }}"
          STORY_NUM="${{ steps.fetch.outputs.story_num }}"
          MODE="${{ steps.fetch.outputs.mode }}"
          BRANCH="notion/story-$POST_TYPE-$STORY_NUM-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/content/date-spots.json src/content/contributor-recipes.json src/content/extended-profiles.json notion/published.json "public/images/**"
          git commit -m "chore: publish Notion Story #$STORY_NUM ($POST_TYPE, $MODE)"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: publish Notion Story #$STORY_NUM ($POST_TYPE)" \
            --body "Automated: this Story passed the publish gate (bilingual parity, Core Review Floor, dated updates, human-authorship attestations). Merging this PR is the act of publishing -- review it like any other content PR." \
            --base main \
            --head "$BRANCH" \
            --draft

      - name: File a report issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -f notion/story-report.md ]; then
            gh issue create \
              --title "Notion Story did not publish" \
              --body-file notion/story-report.md \
              --label "notion-story" || true
          fi

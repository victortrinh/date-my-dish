name: Refresh Pinterest Tokens

on:
  schedule:
    - cron: "0 12 1,25 * *" # 1st and 25th of each month at noon UTC
  workflow_dispatch:

concurrency:
  group: token-refresh
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinterest posting (pinterest-pin-rotation.yml) needs only
      # PINTEREST_ACCESS_TOKEN; the refresh token rotates it before expiry.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh Pinterest tokens
        env:
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: node scripts/refresh-tokens.mjs

name: Fetch Pending Review from Notion
on:
  schedule:
    - cron: '0 1 * * 3'  # Wednesday 1AM UTC (2h before scheduled task)
  workflow_dispatch:

concurrency:
  group: fetch-review
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch from Notion
        run: node scripts/fetch-notion-review.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Create PR with pending file
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -f notion/pending-review.json ]; then
            BRANCH="notion/pending-review-$(date +%Y%m%d)"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add notion/pending-review.json notion/published.json "src/assets/images/reviews/**"
            git commit -m "chore: fetch pending review from Notion" || echo "No changes to commit"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "chore: fetch pending review from Notion" \
              --body "Automated: fetched pending review data and images from Notion." \
              --base main \
              --head "$BRANCH"
          else
            echo "No review ready to publish"
          fi

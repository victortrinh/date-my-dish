name: Auto-Publish Review

on:
  schedule:
    - cron: '0 3 * * 3' # Wednesday 3 AM UTC
  workflow_dispatch: # Manual trigger

concurrency:
  group: auto-publish-review
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Step 1: Fetch review from public Notion database (no auth needed)
      # Uses notion-client (unofficial API) to query the publicly shared database.
      # Note: notion-client depends on Notion's internal /api/v3/ — if it breaks,
      # fall back to the local notion/ folder exports.
      - name: Fetch and select review from Notion
        id: select
        run: node scripts/fetch-notion-review.mjs

      # Step 2: Close stale auto-review PRs
      - name: Close stale auto-review PRs
        if: steps.select.outputs.found == 'true'
        run: |
          OPEN_PRS=$(gh pr list --label "auto-review" --state open --json number --jq '.[].number')
          for PR in $OPEN_PRS; do
            gh pr close "$PR" --comment "Superseded by new auto-publish run."
          done
        env:
          GH_TOKEN: ${{ secrets.CREATE_PR_TOKEN }}

      # Step 3: Claude generates the review
      - name: Claude Code Review Generation
        if: steps.select.outputs.found == 'true'
        run: |
          cat <<'PROMPT' | npx @anthropic-ai/claude-code@latest --print \
            --model claude-sonnet-4-6 \
            --max-turns 45 \
            --allowedTools "Edit,Read,Write,Glob,Grep,Bash(convert:*),Bash(node:*),Bash(npm run:*),Bash(npx:*),Bash(ls:*),Bash(cat:*),Bash(wc:*),Bash(du:*),Bash(file:*),Bash(identify:*),Bash(stat:*),Bash(mkdir:*),Bash(which:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(echo:*),Bash(head:*),Bash(tail:*),Bash(find:*),Bash(sed:*),Bash(jq:*),Bash(test:*),Bash([:*)"
          You are running the automated restaurant review publishing pipeline for Date My Dish.

          ## Input
          Two JSON files have been pre-fetched from the public Notion database:

          1. **`notion-review-selection.json`** — Contains: `pageId`, `recipeNum`, `title`, `mode` ("publish" or "update"), and `existingSlug` (only for updates).
          2. **`notion-review-content.json`** — Contains the full review content:
             - `title`, `recipeNum`, `lastEditedTime`
             - `heroImage`: `{ localPath, caption }` — the hero image has already been downloaded to `/tmp/notion-images/`
             - `restaurantName`, `neighborhood`, `city`, `address`, `website`, `phone` (optional), `cuisine`, `priceRange`, `dateScore`, `reviewCategory`, `bestFor`, `costPerPerson`, `reservationTip`
             - `dishHighlights`: Array of `{ name, description }` objects
             - `dateTypeFit`: Array of `{ type, score, note }` objects
             - `blocks`: Array of structured content blocks, each with a `type` field:
               - `{ type: "heading", level: 2, text: "..." }`
               - `{ type: "paragraph", text: "Markdown text with **bold** and [links](url)..." }`
               - `{ type: "list", style: "unordered"|"ordered", items: ["...", "..."] }`
               - `{ type: "image", url: "...", localPath: "/tmp/notion-images/...", caption: "..." }`
               - `{ type: "callout", icon: "emoji", text: "..." }`
               - `{ type: "divider" }`
             - `faqs`: Array of `{ question, answer }` objects extracted from the review

          Read both files to understand the review content and mode.
          - **publish mode**: Create new EN+FR MDX files and a new published.json entry.
          - **update mode**: The review was already published but has been edited in Notion. The `existingSlug` field contains the current EN slug. Regenerate the EN+FR MDX files in-place (overwrite), keeping the same slugs and `publishDate`, but updating content and `lastSyncedDate` in published.json.

          ## Your Tasks

          ### 1. Optimize the hero image
          The hero image has already been downloaded to the path in `notion-review-content.json` → `heroImage.localPath`.
          Convert to WebP, resize to max 1200px wide, quality 82:
          ```
          convert {heroImage.localPath} -auto-orient -resize '1200x>' -quality 82 src/assets/images/reviews/{slug}.webp
          ```
          If the result exceeds 200KB, reduce quality incrementally until it fits.

          ### 2. Generate the EN slug
          If mode is "update", use the `existingSlug` from the selection JSON.
          If mode is "publish", derive an SEO-friendly English slug from the restaurant name and city:
          - Lowercase, replace spaces with hyphens
          - Remove special characters (colons, apostrophes, parentheses, ampersands)
          - Format: `{restaurant-name}-{city}` (e.g., `moccione-montreal`)
          - Keep it concise and recognizable
          - Examples from existing reviews:
            - "Moccione, Montreal" -> `moccione-montreal`
            - "Joe Beef, Montreal" -> `joe-beef-montreal`

          ### 3. Generate the FR slug
          If mode is "update", read the existing EN MDX file to get the current `translationSlug` value.
          If mode is "publish", use the same slug as EN (reviews share slugs across EN/FR since restaurant names don't translate):
          - Example: `moccione-montreal` -> `moccione-montreal`

          ### 4. Generate EN MDX file
          Create `src/content/reviews/en/{en-slug}.mdx` with:

          **Frontmatter** (match schema exactly — see `src/content/reviews/en/moccione-montreal.mdx` as template):
          - `title`: Original Notion title (in quotes)
          - `lang`: `en`
          - `translationSlug`: The FR slug from step 3
          - `description`: Max 160 chars, SEO-optimized summary (mention restaurant name, city, and date-night angle)
          - `author`: `"Victor"`
          - `publishDate`: Today's date (YYYY-MM-DD). If mode is "update", keep the original publishDate and add `updatedDate` with today's date.
          - `heroImage`: `"../../../assets/images/reviews/{en-slug}.webp"`
          - `heroImageAlt`: Descriptive alt text ~125 chars based on the image
          - `keywords`: 8-12 SEO keywords as array (include restaurant name, city, cuisine type, date night angle)
          - `tags`: 3-5 topic tags as array (e.g., `["italian", "date-night", "pasta", "montreal"]`)
          - `readingTime`: Calculate as ceil(wordCount / 200)
          - `restaurantName`: Restaurant name from Notion content
          - `neighborhood`: Neighborhood from Notion content
          - `city`: City from Notion content
          - `address`: Full address from Notion content
          - `website`: Restaurant website URL from Notion content
          - `phone`: Phone number if available in Notion content (omit field if not present)
          - `cuisine`: Cuisine type from Notion content
          - `priceRange`: Price range (e.g., `"$$$$"`) from Notion content
          - `dateScore`: Numeric date-night score 1-10 from Notion content
          - `reviewCategory`: One of: `dinner`, `lunch`, `brunch`, `bar`, `cafe`
          - `bestFor`: Array of use cases (e.g., `["Date nights", "Anniversaries", "Impressing someone who loves food"]`)
          - `costPerPerson`: Cost range string (e.g., `"$120-200+ CAD"`)
          - `reservationTip`: Short reservation advice string
          - `dishHighlights`: Array of `{ name, description }` objects from Notion content
          - `dateTypeFit`: Array of `{ type, score, note }` objects from Notion content
          - `faqs`: At least 3 FAQ entries with self-contained answers (40-60 words each, each answer should make sense without the question). Use the Notion review's FAQ section as source, but expand brief answers.

          **Before writing the prose body:**
          - Read `docs/brand-voice-guide.md` for voice and tone guidelines
          - Read `.claude/commands/humanizer.md` for anti-AI-pattern rules to apply

          **Body**: Write 800-1500 words of SEO-optimized prose structured as a restaurant review:
          - Start with `import { Picture } from "astro:assets";` and `import heroImg from "../../../assets/images/reviews/{en-slug}.webp";`
          - Opening paragraph (no heading) — hook that sets the scene and stakes of the date-night experience
          - 5-8 H2 sections covering:
            - The Vibe (atmosphere, room, crowd, noise level, intimacy)
            - What to Order (dish-by-dish breakdown of highlights)
            - The Drinks (cocktails, wine, non-alcoholic options)
            - The Real Cost (honest cost breakdown, strategic ordering advice)
            - Booking and Timing (reservation tips, best times to visit)
            - Bottom Line (date score summary, who it's best for)
          - One `<Picture>` component after the first or second section (The Vibe)
          - Use the Notion content as a foundation but REWRITE the prose — make it more engaging, opinionated, and date-night focused
          - Include the "date night" angle throughout (this is a date night restaurant review blog)
          - Internal cross-links to relevant recipes: `/en/recipes/{slug}/` (trailing slash required) — link to any recipes that relate to the cuisine style
          - **Voice**: Confident, opinionated, cheeky — never pretentious. Think: a friend who knows food and wants you to have a great date. Sensual about food, not about people. PG-13 innuendo is fine; vulgarity is not.
          - **Anti-AI patterns to actively avoid** (apply humanizer rules from the file you read):
            - No em dashes (use commas, colons, or rewrite the sentence)
            - No AI vocabulary: "delve", "tapestry", "vibrant", "elevate", "seamlessly", "robust", "foster", "journey", "testament", "unpack", "dive in", "game-changer"
            - No sycophantic openers: never start with "Great question", "Certainly", "Absolutely", "Of course"
            - No vague attributions: replace "many people" / "some say" / "it is often said" with specific claims or just say it directly
            - No hollow transitions: cut "In conclusion", "It is worth noting", "Without further ado", "At the end of the day"
            - No reflexive self-labeling: never call the content "game-changing", "revolutionary", or "transformative"
            - No over-hedging: cut "it is important to note", "please be aware", "it should be mentioned"
            - Avoid gratuitous rule-of-three lists unless the three things genuinely belong together
          - After drafting the prose, self-audit: ask "What makes this sound AI-generated?" then rewrite those parts
          - Apply the same humanizer pass to FAQ answers and `description` frontmatter field

          ### 5. Generate FR MDX file
          Create `src/content/reviews/fr/{fr-slug}.mdx`:
          - Translate ALL frontmatter values to Quebec French (except fields that stay in EN: `restaurantName`, `address`, `website`, `phone`, `cuisine`, `priceRange`, `reviewCategory`)
          - `lang`: `fr`
          - `translationSlug`: The EN slug from step 2
          - `heroImage`: Same path as EN (shared image file)
          - `heroImageAlt`: French translation of alt text
          - `keywords`: French SEO keywords
          - `tags`: French tags
          - `reviewCategory`: Keep the canonical EN value (same as EN file)
          - `bestFor`: Translate to Quebec French
          - `reservationTip`: Translate to Quebec French
          - `dishHighlights`: Translate descriptions to Quebec French (keep dish names in original language)
          - `dateTypeFit`: Translate `type` and `note` fields to Quebec French
          - `faqs`: Fully translated to Quebec French
          - Body: Full Quebec French translation of the EN prose
          - Quebec French conventions: souper (dinner), dejeuner (breakfast), diner (lunch), cuillere a soupe (tbsp), tasses (cups)
          - Cross-links use `/fr/recettes/{slug}/` (French route with trailing slash)
          - Review route uses `/fr/critiques/{slug}/` for self-referential links

          ### 6. Update published.json
          Read `notion/published.json`:

          **If mode = "publish"** — add a new entry:
          ```json
          "{recipe_num}": {
            "notionTitle": "{original Notion title}",
            "slug": "{en-slug}",
            "type": "review",
            "publishedDate": "{today YYYY-MM-DD}",
            "lastSyncedDate": "{today YYYY-MM-DD}",
            "status": "published"
          }
          ```

          **If mode = "update"** — update only `lastSyncedDate` to today:
          ```json
          "{recipe_num}": {
            ...existing fields unchanged...,
            "lastSyncedDate": "{today YYYY-MM-DD}"
          }
          ```

          ### 7. Validate
          First run `node scripts/fetch-ratings.mjs` to generate `data/ratings.json` (required by recipe pages).
          Then run `npm run check` to verify schema compliance.
          If it fails, fix the issues and re-run.

          ### 8. Verify EN/FR pair
          Confirm that:
          - EN file's `translationSlug` matches the FR file's slug (filename without .mdx)
          - FR file's `translationSlug` matches the EN file's slug
          - Both files exist

          ## Restrictions
          - ONLY create/modify files in: `src/content/reviews/`, `src/assets/images/reviews/`, `notion/published.json`
          - In **publish** mode: create new files only (except `notion/published.json`)
          - In **update** mode: overwrite the existing EN+FR MDX files and hero image for the review being updated
          - Do NOT modify components, layouts, pages, i18n files, or config files
          - Do NOT modify `package.json`, `astro.config.ts`, `wrangler.jsonc`, or `CLAUDE.md`

          ## Output
          Provide a summary listing:
          - Mode (publish or update)
          - Review title and Recipe #
          - Restaurant name, city, neighborhood
          - EN slug and FR slug
          - Review category and date score
          - Word count of EN prose
          - Number of FAQs
          - Image optimization result (original size -> final size)
          - Any issues encountered
          PROMPT
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}

      # Step 4: Check for changes and create PR
      - name: Check for changes
        if: steps.select.outputs.found == 'true'
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify build
        if: steps.changes.outputs.has_changes == 'true'
        run: node scripts/fetch-ratings.mjs && npm run check && npm run build
        continue-on-error: true
        id: verify
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}

      - name: Extract review title
        if: steps.changes.outputs.has_changes == 'true'
        id: title
        run: |
          TITLE=$(node -e "const s = require('./notion-review-selection.json'); console.log(s.title || 'New review')" 2>/dev/null || echo "New review")
          echo "review_title=$TITLE" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b auto-review/${{ github.run_id }}
          git add -A
          git commit -m "feat(review): auto-publish restaurant review from Notion

          Generated by Auto-Publish Review workflow.

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push origin auto-review/${{ github.run_id }}
        env:
          GH_TOKEN: ${{ secrets.CREATE_PR_TOKEN }}

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          gh pr create \
            --title "Auto-publish: ${{ steps.title.outputs.review_title }}" \
            --body "## Summary
          - Auto-generated restaurant review from Notion database
          - Created by the weekly auto-publish pipeline

          ## Verify
          - [ ] EN review renders correctly at /en/reviews/{slug}/
          - [ ] FR review renders correctly at /fr/critiques/{slug}/
          - [ ] Images optimized and displaying
          - [ ] JSON-LD schema valid
          - [ ] Restaurant frontmatter fields (dishHighlights, dateTypeFit, etc.) correct
          - [ ] Cross-links to recipes working

          🤖 Generated with [Claude Code](https://claude.com/claude-code)" \
            --label "auto-review"
        env:
          GH_TOKEN: ${{ secrets.CREATE_PR_TOKEN }}

      # Step 6: Create issue on failure
      - name: Create issue on failure
        if: failure()
        run: |
          gh issue create \
            --title "Auto-publish review failed ($(date +%Y-%m-%d))" \
            --body "The weekly auto-publish review workflow failed. [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "auto-review-failure"
        env:
          GH_TOKEN: ${{ github.token }}

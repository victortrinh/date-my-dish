name: Weekly SEO Audit

on:
  schedule:
    - cron: '0 3 * * 0' # Sunday 3 AM UTC
  workflow_dispatch: # Manual trigger

concurrency:
  group: weekly-seo-audit
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Generate dynamic URL list from content directory
      - name: Generate URL list
        id: urls
        run: node scripts/generate-lighthouse-urls.cjs --mode=all

      # Run Lighthouse CI on all pages (1 run per URL for speed)
      - name: Run Lighthouse CI (Desktop)
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc-full.cjs
          uploadArtifacts: true
          artifactName: lighthouse-results-desktop
          temporaryPublicStorage: true

      - name: Run Lighthouse CI (Mobile)
        id: lhci-mobile
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc-mobile-full.cjs
          uploadArtifacts: true
          artifactName: lighthouse-results-mobile
          temporaryPublicStorage: true

      # Save Lighthouse results for Claude
      - name: Save audit results
        if: always()
        run: |
          echo '${{ steps.lhci.outputs.manifest }}' > lighthouse-manifest.json

      # Close any stale weekly SEO PR
      - name: Close stale audit PR
        run: |
          OPEN_PRS=$(gh pr list --label "automated-seo" --state open --json number --jq '.[].number')
          for PR in $OPEN_PRS; do
            gh pr close "$PR" --comment "Superseded by new weekly SEO audit run."
          done
        env:
          GH_TOKEN: ${{ github.token }}

      # Claude Code analyzes and fixes
      - name: Claude Code SEO Analysis
        run: |
          cat <<'PROMPT' | npx @anthropic-ai/claude-code@latest --print \
            --model claude-sonnet-4-6 \
            --max-turns 30 \
            --allowedTools "Edit,Read,Write,Glob,Grep,Bash(npm run check*),Bash(node *),Bash(wc *),Bash(stat *),Bash(ls *)"
          You are running the weekly automated SEO audit for Date My Dish.

          ## Input Data
          Read `lighthouse-manifest.json` in the repo root for Lighthouse scores per page.

          ## Your Tasks

          1. **Analyze Lighthouse scores**: Identify pages scoring below 90 in any category.

          2. **Validate JSON-LD**: For each recipe and article in `dist/`, check the generated HTML for:
             - Recipe schema with all required properties (recipes only)
             - Article schema with required properties (articles only)
             - Image in array format `[url]`
             - FAQPage schema present
             - BreadcrumbList schema present

          3. **Check content quality** in `src/content/recipes/` and `src/content/articles/`:
             - `description` <= 160 characters
             - `heroImageAlt` descriptive, ~125 chars, no "Image of" prefix
             - At least 3 FAQs per recipe/article
             - MDX body word count >= 800 words
             - At least 3 H2 headings in prose
             - Internal cross-links present with trailing slashes
             - EN/FR pairs properly linked via `translationSlug`

          4. **Check images**: Verify hero images < 200KB, step images < 150KB

          5. **Fix issues**: Edit files to fix problems found. Be specific and targeted.

          6. **After making changes**, first run `node scripts/fetch-ratings.mjs` to generate `data/ratings.json`, then run `npm run check` to verify no TypeScript/schema errors.

          ## Restrictions
          - ONLY modify files in `src/content/recipes/` and `src/content/articles/` (MDX frontmatter and prose)
          - Do NOT modify files in `src/components/`, `src/layouts/`, `src/pages/`, `src/i18n/`, or config files
          - Do NOT rewrite prose content wholesale — only fix specific issues (meta descriptions, alt text, cross-links, headings)
          - Do NOT modify `package.json`, `astro.config.ts`, `wrangler.jsonc`, or `CLAUDE.md`

          ## Output
          After making all fixes, provide a summary listing:
          - Pages with scores below 90 and which categories
          - Issues found and fixes applied (grouped by type)
          - Any issues that require manual attention
          PROMPT
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}

      # Check for changes
      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # Verify Claude's changes build successfully
      - name: Verify build after fixes
        if: steps.changes.outputs.has_changes == 'true'
        run: node scripts/fetch-ratings.mjs && npm run check && npm run build
        continue-on-error: true
        id: verify
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b seo-audit/${{ github.run_id }}
          git add -A
          git commit -m "fix(seo): weekly SEO audit fixes

          Generated by Weekly SEO Audit workflow.

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push origin seo-audit/${{ github.run_id }}
        env:
          GH_TOKEN: ${{ secrets.CREATE_PR_TOKEN }}

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          gh pr create \
            --title "SEO Audit: weekly fixes" \
            --body "## Summary
          - Automated weekly SEO audit and fixes
          - Lighthouse scores analyzed, content quality checked

          ## Verify
          - [ ] All recipe and article pages still render correctly
          - [ ] No schema validation errors
          - [ ] Meta descriptions within 160 chars

          🤖 Generated with [Claude Code](https://claude.com/claude-code)" \
            --label "automated-seo"
        env:
          GH_TOKEN: ${{ secrets.CREATE_PR_TOKEN }}

name: Weekly SEO Audit

on:
  schedule:
    - cron: '0 3 * * 0' # Sunday 3 AM UTC
  workflow_dispatch: # Manual trigger

concurrency:
  group: weekly-seo-audit
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore Astro image cache
        uses: actions/cache@v5
        with:
          path: node_modules/.astro
          key: astro-image-cache-${{ runner.os }}-${{ hashFiles('src/assets/images/**') }}
          restore-keys: |
            astro-image-cache-${{ runner.os }}-

      - run: npm run build

      # Generate dynamic URL list from content directory
      - name: Generate URL list
        id: urls
        run: node scripts/generate-lighthouse-urls.cjs --mode=all

      # Run Lighthouse CI on all pages (1 run per URL for speed)
      - name: Run Lighthouse CI (Desktop)
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc-full.cjs
          uploadArtifacts: true
          artifactName: lighthouse-results-desktop
          temporaryPublicStorage: true

      - name: Run Lighthouse CI (Mobile)
        id: lhci-mobile
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc-mobile-full.cjs
          uploadArtifacts: true
          artifactName: lighthouse-results-mobile
          temporaryPublicStorage: true

      - name: Create PR with Lighthouse results
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          mkdir -p data/lighthouse
          cp .lighthouseci/manifest.json data/lighthouse/lighthouse-$(date +%Y-%m-%d).json 2>/dev/null || cp lighthouse-manifest.json data/lighthouse/lighthouse-$(date +%Y-%m-%d).json 2>/dev/null || echo "No manifest found"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/lighthouse-results-$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add data/lighthouse/
          git commit -m "chore: save Lighthouse results for $(date +%Y-%m-%d)" || exit 0
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: save Lighthouse results for $(date +%Y-%m-%d)" \
            --body "Automated: weekly Lighthouse CI audit results." \
            --base main \
            --head "$BRANCH"

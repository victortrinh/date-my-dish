name: Pinterest - Update Existing Pins

on:
  workflow_dispatch:
    inputs:
      recipe_slug:
        description: "Recipe slug (leave empty to update all)"
        required: false
        default: ""
      update_link:
        description: "Update destination URLs"
        required: false
        type: boolean
        default: true
      update_description:
        description: "Update titles and descriptions"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Dry run (preview changes without API calls)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Update Pinterest pins
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.recipe_slug }}" ]; then
            ARGS="$ARGS --slug=${{ inputs.recipe_slug }}"
          fi
          if [ "${{ inputs.update_link }}" = "true" ] && [ "${{ inputs.update_description }}" = "false" ]; then
            ARGS="$ARGS --update-link"
          fi
          if [ "${{ inputs.update_description }}" = "true" ] && [ "${{ inputs.update_link }}" = "false" ]; then
            ARGS="$ARGS --update-description"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/pinterest-update-pins.mjs $ARGS

      - name: Create PR with updated log
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/pinterest-update-pins-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add data/social-posts-log.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update Pinterest pin metadata"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: update Pinterest pin metadata" \
            --body "Automated: Pinterest pin metadata update log." \
            --base main \
            --head "$BRANCH"
